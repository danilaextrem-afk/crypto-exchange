name: Build APK

on:
  push:
    # freevpn — основная ветка репозитория; без неё пуши не собирались.
    branches: [main, freevpn]
    tags: ["v*"]
  pull_request:
    branches: [main, freevpn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "Используется постоянный ключ из секретов (обновления ставятся поверх)."
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias freevpn \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass freevpn-ci -keypass freevpn-ci -dname "CN=FreeVPN"
            echo "KEYSTORE_PASSWORD=freevpn-ci" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=freevpn-ci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=freevpn" >> "$GITHUB_ENV"
            echo "::warning::Постоянный ключ не задан: ключ одноразовый, при обновлении сначала удалите старую версию."
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        env:
          DIRECTORY_URLS: ${{ vars.DIRECTORY_URLS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FreeVPN.apk

      - name: Verify APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ls -l FreeVPN.apk
          echo "--- подпись"
          "$BT/apksigner" verify --verbose --print-certs FreeVPN.apk | head -12
          echo "--- манифест"
          "$BT/aapt2" dump badging FreeVPN.apk | grep -E "^package|^sdkVersion|^targetSdkVersion|^uses-permission|launchable-activity" | cut -c1-160
          echo "--- содержимое"
          unzip -l FreeVPN.apk > apk-listing.txt
          grep -E "assets/directory.json|libwg-go.so" apk-listing.txt
          grep -q "assets/directory.json" apk-listing.txt || { echo "В APK нет каталога узлов"; exit 1; }
          grep -q "lib/arm64-v8a/libwg-go.so" apk-listing.txt || { echo "В APK нет нативной библиотеки WireGuard для arm64"; exit 1; }
          "$BT/aapt2" dump badging FreeVPN.apk | grep -q "uses-permission: name='android.permission.INTERNET'" || { echo "Нет разрешения INTERNET"; exit 1; }
          echo "APK проверен"

      - name: Inspect APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ls -l FreeVPN.apk
          sha256sum FreeVPN.apk
          "$BT/aapt2" dump badging FreeVPN.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|native-code|application-label:)"
          "$BT/apksigner" verify --verbose --print-certs FreeVPN.apk | grep -E "^Verified|Signer #1 certificate (DN|SHA-256)"
          unzip -l FreeVPN.apk | grep -E "lib/.*\.so"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeVPN-apk
          path: FreeVPN.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FreeVPN.apk

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Node tests
        working-directory: server/node
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Monitor tests
        working-directory: server/monitor
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
