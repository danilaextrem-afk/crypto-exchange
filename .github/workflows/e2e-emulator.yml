name: E2E on emulator

# Сквозная проверка на эмуляторе Android с НАСТОЯЩИМ WireGuard-сервером,
# который поднимается на машине сборки скриптом server/setup-wireguard.sh.
# Ключи сервера и клиентов создаются заново при каждом запуске и исчезают вместе с машиной.

# Один запуск ≈ 25 минут Actions. Для приватного репозитория минуты ограничены тарифом,
# поэтому тест идёт на pull request и вручную (Actions → E2E on emulator → Run workflow),
# а не повторно на каждый пуш после слияния.
on:
  pull_request:
    branches: [main, freevpn]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Эмулятору нужно ~7.5 ГБ, а на машине свободно ~6.5 ГБ: удаляем ненужные проекту инструменты.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY/CodeQL" \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build release APK (same code as the published one)
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebugAndroidTest
          cp app/build/outputs/apk/release/app-release.apk FreeVPN.apk

      - name: Start real WireGuard server (server/setup-wireguard.sh)
        run: |
          sudo PUBLIC_IP=10.0.2.2 SERVER_NAME="CI test" SERVER_COUNTRY=DE bash server/setup-wireguard.sh 51820 2
          sudo wg show
          for i in 1 2; do sudo base64 -w0 "/root/freevpn-clients/client$i.conf" > "$RUNNER_TEMP/c$i.b64"; done

      # Настоящий узел из server/node: свой интерфейс wg1, HTTPS-API с самоподписанным сертификатом.
      # Эмулятор видит хост по адресу 10.0.2.2. Тест NodeE2ETest идёт по цепочке
      # каталог -> проба с пином -> регистрация ключа -> туннель.
      - name: Start real freevpn-node (server/node)
        run: |
          (cd server/node && go vet ./... && go test ./... && go build -o "$RUNNER_TEMP/freevpn-node" .)
          sudo ip link add wg1 type wireguard
          wg genkey | sudo tee /etc/wg1.key > /dev/null
          sudo chmod 600 /etc/wg1.key
          sudo wg set wg1 listen-port 51821 private-key /etc/wg1.key
          sudo ip addr add 10.9.0.1/24 dev wg1
          sudo ip link set wg1 mtu 1380 up
          IFACE="$(ip -4 route show default | awk '{print $5; exit}')"
          sudo iptables -A FORWARD -i wg1 -j ACCEPT
          sudo iptables -A FORWARD -o wg1 -j ACCEPT
          sudo iptables -t nat -A POSTROUTING -s 10.9.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo mkdir -p /var/lib/freevpn-ci
          sudo env PUBLIC_HOST=10.0.2.2 LISTEN=:8443 WG_IF=wg1 WG_PORT=51821 SUBNET=10.9.0.0/24 \
            STATE_DIR=/var/lib/freevpn-ci nohup "$RUNNER_TEMP/freevpn-node" > "$RUNNER_TEMP/node.log" 2>&1 &
          for i in $(seq 1 20); do [ -s /var/lib/freevpn-ci/cert.pin ] && break; sleep 1; done
          sudo cat /var/lib/freevpn-ci/cert.pin | tr -d '\n' > "$RUNNER_TEMP/node.pin"
          echo "pin: $(cat "$RUNNER_TEMP/node.pin")"
          cat "$RUNNER_TEMP/node.log"
          curl -sk https://127.0.0.1:8443/v1/health; echo

      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/e2e-run.sh

      - name: Results summary
        if: always()
        run: |
          echo "=== wg show (сервер)"; cat e2e-out/wg-show.txt 2>/dev/null || true
          echo "=== DNS"; cat e2e-out/dns-summary.txt 2>/dev/null || true
          echo "=== wg1 (узел каталога)"; cat e2e-out/wg1-show.txt 2>/dev/null || true
          echo "=== node.log"; cat e2e-out/node.log 2>/dev/null || true
          echo "=== release"; cat e2e-out/release-start.txt 2>/dev/null || true
          echo "=== тесты"
          for f in app/build/outputs/androidTest-results/connected/debug/*.xml app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] && grep -oE '<testcase [^>]*name="[^"]*"[^>]*>|<failure[^>]*>' "$f" | head -40
          done
          echo "=== журнал теста (FreeVpnE2E)"
          grep -h "FreeVpnE2E" e2e-out/logcat-instrumented.txt 2>/dev/null | tail -80 || true

      - name: Screenshots to log
        if: always()
        run: |
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick >/dev/null
          for f in e2e-out/screens/*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 540x -quality 72 "${f%.png}.jpg"
            echo "=== SHOT $(basename "${f%.png}")"; base64 -w0 "${f%.png}.jpg"; echo; echo "=== END"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e-out/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
